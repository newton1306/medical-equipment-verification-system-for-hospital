<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAFAFB">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <title>Dashboard — Equipment Verify</title>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">🏥 Verify</div>
        <div class="nav-links">
            <a href="/" class="nav-link">Verify</a>
            <a href="/admin" class="nav-link">Sets</a>
            <a href="/dashboard" class="nav-link active">Dashboard</a>
        </div>
    </nav>
    <main class="container">
        <div class="dashboard-header">
            <h1>Metrics Dashboard</h1>
            <div class="metrics-row" id="stats-grid">
                <div class="metric"><span class="metric-value">-</span><span class="metric-label">Total Logs</span></div>
                <div class="metric"><span class="metric-value pass">-</span><span class="metric-label">Pass</span></div>
                <div class="metric"><span class="metric-value fail">-</span><span class="metric-label">Fail</span></div>
                <div class="metric"><span class="metric-value">-</span><span class="metric-label">Pass Rate</span></div>
            </div>
        </div>

        <div>
            <h2 style="margin-bottom: 1rem;">Recent Verifications</h2>
            <div id="recent-logs" class="log-list"></div>
        </div>
    </main>
    <script>
    async function loadDashboard() {
        try {
            const appPw = localStorage.getItem('appPw') || '';
            const res = await fetch('/api/dashboard', {
                headers: { 'X-App-Password': appPw }
            });
            if (res.status === 401) {
                alert('โปรดเข้าสู่ระบบจากหน้าหลัก');
                window.location.href = '/';
                return;
            }
            const d = await res.json();
            const grid = document.getElementById('stats-grid');
            grid.innerHTML = `
                <div class="metric"><span class="metric-value">${d.total}</span><span class="metric-label">Total Logs</span></div>
                <div class="metric"><span class="metric-value pass">${d.pass_count}</span><span class="metric-label">Pass</span></div>
                <div class="metric"><span class="metric-value fail">${d.fail_count}</span><span class="metric-label">Fail</span></div>
                <div class="metric"><span class="metric-value">${d.pass_rate}%</span><span class="metric-label">Pass Rate</span></div>`;

            const logs = document.getElementById('recent-logs');
            if (!d.recent_logs || d.recent_logs.length === 0) {
                logs.innerHTML = '<div style="text-align:center; padding: 4rem 1rem; color: var(--ink-secondary);"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:1rem; opacity:0.5;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg><p>No verification logs found.</p></div>';
                return;
            }
            logs.innerHTML = d.recent_logs.map(l => {
                const status = (l.status || 'unknown').toLowerCase();
                const time = l.created_at ? new Date(l.created_at).toLocaleString('en-GB') : '';
                let detailsHtml = '';
                
                try {
                    if (l.vlm_response) {
                        const vlm = JSON.parse(l.vlm_response);
                        if (status === 'pass') {
                            detailsHtml = `<div class="text-small" style="color: var(--pass); margin-top: 4px;">Complete matching.</div>`;
                        } else if (status === 'fail') {
                            const missingArray = vlm.missing || [];
                            const extraArray = vlm.extra || [];
                            let listsHtml = '';
                            if (missingArray.length) {
                                listsHtml += `<div style="color: var(--fail); font-weight: 600; margin-top:4px;">Missing: ${missingArray.join(', ')}</div>`;
                            }
                            if (extraArray.length) {
                                listsHtml += `<div style="color: var(--warn); font-weight: 600; margin-top:4px;">Extra: ${extraArray.join(', ')}</div>`;
                            }
                            detailsHtml = `<div class="text-small" style="margin-top: 4px;">${listsHtml}</div>`;
                        } else {
                            detailsHtml = `<div class="text-small" style="color: var(--warn); margin-top: 4px;">Uncertain: ${vlm.reason || ''}</div>`;
                        }
                    }
                } catch(e) {}

                return `<div class="log-item">
                    <div class="log-info">
                        <span class="log-title">${l.set_id}</span>
                        <span class="log-meta">${time} · ${l.model_used || 'AI'} · ${l.elapsed_sec || 0}s</span>
                        ${detailsHtml}
                    </div>
                    <span class="log-badge ${status}">${l.status.toUpperCase()}</span>
                </div>`;
            }).join('');
        } catch (e) {
            console.error(e);
        }
    }
    document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
