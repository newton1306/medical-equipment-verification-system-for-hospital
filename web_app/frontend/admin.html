<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <title>Admin — Equipment Verify</title>
</head>

<body>
    <nav class="nav">
        <div class="nav-brand">🏥 Equipment Verify</div>
        <div class="nav-links">
            <a href="/" class="nav-link">ตรวจสอบ</a>
            <a href="/admin" class="nav-link active">จัดการ Set</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
        </div>
    </nav>
    <main class="container">
        <div class="admin-header">
            <h1 style="font-size:1.3rem">⚙️ จัดการชุดเครื่องมือ</h1>
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ เพิ่ม Set</button>
        </div>
        <div id="sets-list"></div>
    </main>

    <!-- Modal -->
    <div id="modal-backdrop" class="modal-backdrop hidden" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="modal-title">เพิ่ม Set ใหม่</h3>
            <div class="form-group">
                <label>ID (ภาษาอังกฤษ, ห้ามเว้นวรรค)</label>
                <input class="form-input" id="f-id" placeholder="dressing_set">
            </div>
            <div class="form-group">
                <label>ชื่อ (EN)</label>
                <input class="form-input" id="f-name" placeholder="Dressing Set">
            </div>
            <div class="form-group">
                <label>ชื่อ (TH)</label>
                <input class="form-input" id="f-name-th" placeholder="ชุดทำแผล">
            </div>
            <div class="form-group">
                <label>Reference Image URL</label>
                <input class="form-input" id="f-ref-url" placeholder="https://...">
            </div>
            <div class="form-group" style="margin-top:20px; border-top:1px solid var(--border); padding-top:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
                    <label style="margin:0">Checklist อุปกรณ์</label>
                    <div style="display:flex; gap: 8px;">
                        <button class="btn btn-outline btn-sm" id="btn-toggle-json" onclick="toggleJsonMode()">สลับโหมด JSON</button>
                        <button class="btn btn-outline btn-sm" id="btn-add-item" onclick="addChecklistItem()">+ เพิ่มอุปกรณ์</button>
                    </div>
                </div>
                <!-- Form Mode -->
                <div id="checklist-items-container" style="display:flex; flex-direction:column; gap:8px;">
                    <!-- Items injected by JS -->
                </div>
                <!-- JSON Mode -->
                <textarea class="form-input hidden" id="f-checklist" rows="8" placeholder='[{"item_name":"Tooth forceps","quantity":1,"mode":"exact"}]'></textarea>
            </div>
            <div class="modal-actions" style="margin-top:24px;">
                <button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
                <button class="btn btn-primary" id="btn-save" onclick="saveSet()">บันทึก</button>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>

</html>
