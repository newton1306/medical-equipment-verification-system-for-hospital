<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAFAFB">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <title>Admin — Equipment Verify</title>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">🏥 Verify</div>
        <div class="nav-links">
            <a href="/" class="nav-link">Verify</a>
            <a href="/admin" class="nav-link active">Sets</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
        </div>
    </nav>
    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Instrument Sets</h1>
            <button class="btn btn-primary" onclick="openAddModal()">Add Set</button>
        </div>
        <div id="sets-list" class="admin-list"></div>
    </main>

    <!-- Modal -->
    <div id="modal-backdrop" class="modal-overlay hidden" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title">New Instrument Set</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="form-group">
                <label class="form-label">Set ID (e.g. dressing_set)</label>
                <input class="form-input" id="f-id" placeholder="dressing_set">
            </div>
            
            <div class="form-group">
                <label class="form-label">Name (EN)</label>
                <input class="form-input" id="f-name" placeholder="Dressing Set">
            </div>
            
            <div class="form-group">
                <label class="form-label">Name (TH)</label>
                <input class="form-input" id="f-name-th" placeholder="ชุดทำแผล">
            </div>
            
            <div class="form-group">
                <label class="form-label">Reference Image URL</label>
                <input class="form-input" id="f-ref-url" placeholder="https://...">
            </div>
            
            <div class="form-group" style="margin-top:2rem; padding-top:1.5rem; border-top: 1px solid var(--border);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                    <label class="form-label" style="margin:0;">Equipment Checklist</label>
                    <div style="display:flex; gap: 0.5rem;">
                        <button class="btn btn-outline" style="padding: 0.5rem 0.75rem; font-size: 0.8125rem;" id="btn-toggle-json" onclick="toggleJsonMode()">JSON Mode</button>
                        <button class="btn btn-outline" style="padding: 0.5rem 0.75rem; font-size: 0.8125rem;" id="btn-add-item" onclick="addChecklistItem()">Add Item</button>
                    </div>
                </div>
                
                <!-- Form Mode -->
                <div id="checklist-items-container" style="display:flex; flex-direction:column; gap:0.5rem;">
                    <!-- Items injected by JS -->
                </div>
                
                <!-- JSON Mode -->
                <textarea class="form-input hidden" id="f-checklist" rows="8" placeholder='[{"item_name":"Tooth forceps","quantity":1,"mode":"exact"}]' style="font-family: monospace; resize: vertical;"></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="btn-save" onclick="saveSet()">Save Set</button>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
